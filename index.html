
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b2b">
  <title>Gardaş Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="brand-icon">💬</div>
      <h1>Gardaş Chat</h1>
      <p>Ücretsiz sohbete katıl</p>

      <input
        id="loginNick"
        maxlength="24"
        placeholder="Nickini yaz..."
        autocomplete="off"
      >

      <button id="loginBtn">Sohbete Gir</button>
    </div>
  </div>

  <!-- ANA CHAT -->
  <div id="app" class="app hidden">

    <!-- ÜST BAR -->
    <header class="topbar">

      <div class="brand">
        <div class="brand-icon small">💬</div>

        <div>
          <strong>Gardaş Chat</strong>
          <span>Sohbetin yeni adresi</span>
        </div>
      </div>

      <div class="top-actions">

        <span id="status" class="status">
          🟢 Bağlandı
        </span>

        <div class="profile">
          <span class="avatar">👤</span>
          <span id="myNick">Misafir</span>
        </div>

        <button id="logoutBtn" class="logout">
          Çıkış Yap
        </button>

      </div>

    </header>

    <!-- ODALAR -->
    <section class="rooms-wrap">

      <div class="section-title">
        Odalar
      </div>

      <div id="rooms" class="rooms"></div>

    </section>

    <!-- İÇERİK -->
    <div class="content">

      <!-- SOHBET -->
      <main class="chat">

        <div class="chat-head">

          <div>
            <strong id="roomName">Genel</strong>

            <span id="roomDesc">
              Herkese açık sohbet odası
            </span>
          </div>

          <span id="onlineCount">
            0 kişi online
          </span>

        </div>

        <!-- MESAJLAR -->
        <section id="messages" class="messages"></section>

        <!-- MESAJ YAZMA -->
        <form id="form" class="composer">

          <button
            type="button"
            class="emoji"
            id="emojiBtn"
          >
            ☺
          </button>

          <input
            id="text"
            maxlength="500"
            placeholder="Mesajını yaz..."
            autocomplete="off"
          >

          <button
            class="send"
            type="submit"
          >
            ➤ <span>Gönder</span>
          </button>

        </form>

      </main>

      <!-- ONLINE KULLANICILAR -->
      <aside class="users-panel">

        <div class="users-head">

          <strong>
            👥 Online Kullanıcılar
          </strong>

          <span id="userCount">
            0
          </span>

        </div>

        <div id="users"></div>

      </aside>

    </div>

  </div>

  <!-- SOCKET.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- CHAT JAVAS
